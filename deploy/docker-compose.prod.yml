# Runs on the rankarenas EC2 box, in /home/ubuntu/sheet.
#
# The image is the static export of the app served by an unprivileged nginx
# (see dockerfile/). It joins rankarena's compose network so rankarena's
# nginx can reach it as `sheet:3001`; nothing is published on the host.

services:
  sheet:
    image: ${ECR_REGISTRY}/sheet-app:${IMAGE_TAG}
    # Static files only: no writes outside nginx's temp dir, no privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      - rankarena
    restart: unless-stopped

networks:
  rankarena:
    name: rankarena_default
    external: true
