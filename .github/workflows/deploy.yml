name: Build → ECR → Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the box at once.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sheet-app

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image carries no secrets: all config is runtime env on the server.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    ./dockerfile/Dockerfile
          push:    true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get ECR registry and password
        id: ecr
        run: |
          echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
          echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "deploy/docker-compose.prod.yml"
          target:   /home/ubuntu/sheet/
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr.outputs.password }}
          REGISTRY:     ${{ steps.ecr.outputs.registry }}
          TAG:          ${{ github.sha }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_PASSWORD,REGISTRY,TAG
          script: |
            set -e
            cd /home/ubuntu/sheet

            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$REGISTRY"

            # Record which image to run (add the keys if missing).
            grep -q "^IMAGE_TAG=" .env \
              && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$TAG|" .env \
              || echo "IMAGE_TAG=$TAG" >> .env
            grep -q "^ECR_REGISTRY=" .env \
              && sed -i "s|^ECR_REGISTRY=.*|ECR_REGISTRY=$REGISTRY|" .env \
              || echo "ECR_REGISTRY=$REGISTRY" >> .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Drop superseded sheet-app images only; rankarena's deploy
            # manages its own. In-use images refuse removal, which is fine.
            docker image ls "$REGISTRY/sheet-app" --format '{{.ID}} {{.Tag}}' \
              | grep -v " $TAG$" | awk '{print $1}' | sort -u \
              | xargs -r docker rmi 2>/dev/null || true

            echo "Deploy complete: $TAG"
