# Serves the static export of the app (out/). It runs behind the rankarena
# proxy, which terminates TLS for hm0.org and forwards here on :3001.

map $uri $sheet_cache_control {
    # Build assets have content hashes in their names.
    ~^/_next/static/         "public, max-age=31536000, immutable";
    # Pages must pick up a new deploy immediately (revalidated via ETag).
    ~\.(html|txt)$           "no-cache";
    default                  "public, max-age=86400";
}

server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative Location headers, so redirects keep the public https host.
    absolute_redirect off;

    # Text assets are gzipped at build time (gzip_static); anything else
    # is compressed on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header Cache-Control $sheet_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Next.js inlines its hydration data as <script> tags, hence 'unsafe-inline';
    # canvas-confetti draws in a blob: worker; the Google hosts are for
    # Google Analytics (per Google's GA4 CSP guide).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    # /topics/arrays/ -> /topics/arrays (one URL per page).
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        # /topics/arrays is exported as topics/arrays.html.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Generated images are exported without a file extension.
    location ~ ^/(sde-sheet/)?(opengraph-image|apple-icon)$ {
        default_type image/png;
    }

    # Not in nginx's stock mime.types.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
